name: Uptime Monitor
on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping website
        id: ping
        run: |
          START=$(date +%s%3N)
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" https://souhailchaiberras.vercel.app/)
          END=$(date +%s%3N)
          LATENCY=$((END-START))
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "latency=$LATENCY" >> $GITHUB_OUTPUT
      - name: Send alert if down
        if: steps.ping.outputs.http_code != '200'
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: '{"text": "🚨 Site is down! HTTP {{steps.ping.outputs.http_code}} latency {{steps.ping.outputs.latency}}ms"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

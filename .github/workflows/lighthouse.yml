name: Lighthouse CI

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:

env:
  LHCI_TIMEOUT: 120000   # 2 min timeout for slow sites

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install LHCI
        run: npm i -g @lhci/cli@0.13
      - name: Run Lighthouse
        id: lhci
        continue-on-error: true
        run: |
          lhci collect \
            --url https://souhailchaiberras.vercel.app/ \
            --numberOfRuns 1 \
            --output html \
            --output json \
            --settings.maxWaitForLoad=60000 \
            --settings.maxWaitForFcp=60000 \
            --chrome-flags="--no-sandbox --disable-dev-shm-usage --disable-gpu"
      - name: Upload results
        run: |
          lhci upload \
            --target "temporary-public-storage"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
